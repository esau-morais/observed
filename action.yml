name: Run Observed
description: Capture your app's saved journey on the pull request's base and head, compare them, and post the result to the pull request.
author: esau-morais

branding:
  icon: eye
  color: blue

inputs:
  project:
    description: Directory containing observed.json, relative to the workspace.
    default: .
  base:
    description: Revision to compare against, such as the pull request's base SHA. The checkout must already contain it.
    required: true
  candidate:
    description: Revision to capture as the candidate.
    default: HEAD
  timeout:
    description: Milliseconds allowed for each capture.
    default: '120000'
  artifact-name:
    description: Name of the uploaded evidence bundle. The report page is uploaded as this name plus .html.
    default: observed-bundle
  retention-days:
    description: Days GitHub keeps the artifact.
    default: '7'
  github-token:
    description: Token that titles this job's check with the result and posts the pull request comment. The workflow needs checks write and pull-requests write permissions.
    default: ${{ github.token }}
  comment:
    description: always posts or updates one comment on the pull request. off posts none; the job's check and summary still carry the result, and Slack, which keeps its message ID in the comment, posts a new message for each failing run.
    default: always
  image-upload-token:
    description: 'Optional. A personal access token or OAuth token of a user with write access to the repository. With it, the comment shows the screenshot crops instead of linking them. GitHub refuses this upload for github-token and GitHub App tokens. The image shows page content and is uploaded as that user. Pass it from a repository secret.'
    default: ''
  github-app-client-id:
    description: Optional. Client ID of a GitHub App with Pull requests write access. With github-app-private-key, the App signs the pull request comment instead of github-actions.
    default: ''
  github-app-private-key:
    description: Private key of that GitHub App. Pass it from a repository secret.
    default: ''
  slack-bot-token:
    description: Bot token of a Slack app with the chat:write scope. With slack-channel, failing results are posted to Slack. Pass it from a repository secret.
    default: ''
  slack-channel:
    description: ID of the Slack channel to post to, such as C0123456789. Invite the bot to it first.
    default: ''
  slack-images:
    description: 'true posts the screenshot crops, before, after and changed pixels around the largest changed region, in the thread of a failing Slack message. The image shows page content, including text. Needs the files:write scope; without it the message is posted without the image.'
    default: 'false'
  job-outcome:
    description: Deprecated and ignored. The job's own check carries the result, so the job fails whenever the result fails or is unavailable.
    default: ''

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: ${{ github.action_path }}/package.json

    # Installs the CLI release matching this action's package.json by exact
    # version. npm never reuses a version, but nothing pins the tarball's hash.
    # Observed's own workflows set OBSERVED_FROM_SOURCE to pack and install
    # the checked-out source the same way instead.
    - name: Install Observed and its browser
      id: install
      shell: bash
      run: |
        cli="$(mktemp -d "$RUNNER_TEMP/observed-cli-XXXXXX")"
        if [ "${OBSERVED_FROM_SOURCE:-}" = true ]; then
          # The runner stores an action pinned by SHA under that SHA, without Git history.
          ref="$(basename "$GITHUB_ACTION_PATH")"
          if [[ "$ref" =~ ^[0-9a-f]{40}$ ]]; then export OBSERVED_SOURCE_COMMIT="$ref"; fi
          (cd "$GITHUB_ACTION_PATH" && bun install --frozen-lockfile && bun run build && bun pm pack --destination "$cli" --quiet >/dev/null)
          package="$(ls "$cli"/*.tgz)"
        else
          version="$(bun --print "(await Bun.file(process.env.GITHUB_ACTION_PATH + '/package.json').json()).version")"
          package="@observed-software/cli@$version"
        fi
        cd "$cli"
        echo '{"private":true}' > package.json
        bun add --exact --ignore-scripts "$package"
        root="$cli/node_modules/@observed-software/cli"
        echo "cli=$root/dist/observed.js" >> "$GITHUB_OUTPUT"
        echo "script=$root/dist/github-action.js" >> "$GITHUB_OUTPUT"
        bun "$root/dist/observed.js" --version
        bun "$root/dist/observed.js" setup --with-deps

    - name: Check observed.json
      shell: bash
      env:
        OBSERVED_PROJECT: ${{ inputs.project }}
        OBSERVED_JOB_OUTCOME: ${{ inputs.job-outcome }}
        OBSERVED_SCRIPT: ${{ steps.install.outputs.script }}
        OBSERVED_GITHUB_TOKEN: ${{ inputs.github-token }}
        OBSERVED_CHECK_RUN_ID: ${{ job.check_run_id }}
        OBSERVED_PULL_REQUEST: ${{ github.event.pull_request.number }}
        OBSERVED_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
      run: |
        if [ -n "$OBSERVED_JOB_OUTCOME" ]; then
          echo "::warning title=Observed::job-outcome is deprecated and has no effect. This job's own check carries the result: require the job, and name it Observed."
        fi
        bun "$OBSERVED_SCRIPT" preflight "$OBSERVED_PROJECT"

    - name: Run Observed
      id: observe
      shell: bash
      env:
        OBSERVED_PROJECT: ${{ inputs.project }}
        OBSERVED_BASE: ${{ inputs.base }}
        OBSERVED_CANDIDATE: ${{ inputs.candidate }}
        OBSERVED_TIMEOUT: ${{ inputs.timeout }}
        OBSERVED_CLI: ${{ steps.install.outputs.cli }}
      run: |
        bundle="$(mktemp -d "$RUNNER_TEMP/observed-XXXXXX")"
        echo "bundle=$bundle" >> "$GITHUB_OUTPUT"
        # Captured application output is untrusted; keep it from issuing workflow commands.
        token="$(openssl rand -hex 16)"
        echo "::stop-commands::$token"
        code=0
        bun "$OBSERVED_CLI" observe "$OBSERVED_PROJECT" \
          --base "$OBSERVED_BASE" \
          --candidate "$OBSERVED_CANDIDATE" \
          --timeout "$OBSERVED_TIMEOUT" \
          --output "$bundle/run" \
          --json > "$bundle/result.json" || code=$?
        echo "::$token::"
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"

    - name: Write the report page
      id: page
      if: always() && steps.observe.outputs.bundle != ''
      shell: bash
      env:
        OBSERVED_BUNDLE: ${{ steps.observe.outputs.bundle }}
        OBSERVED_ARTIFACT: ${{ inputs.artifact-name }}
        OBSERVED_SCRIPT: ${{ steps.install.outputs.script }}
      run: |
        page="$(mktemp -d "$RUNNER_TEMP/observed-page-XXXXXX")/$OBSERVED_ARTIFACT.html"
        if bun "$OBSERVED_SCRIPT" page "$OBSERVED_BUNDLE/run/report" "$OBSERVED_BUNDLE/result.json" "$page"; then
          echo "path=$page" >> "$GITHUB_OUTPUT"
        else
          echo "::warning title=Observed::No report page was written. The job summary and the evidence bundle still hold the result."
        fi

    # With archive: false, GitHub serves the single HTML file in the browser.
    - name: Upload the report page
      id: upload-page
      if: always() && steps.page.outputs.path != ''
      continue-on-error: true
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        path: ${{ steps.page.outputs.path }}
        archive: false
        retention-days: ${{ inputs.retention-days }}

    - name: Crop the changed screenshots
      id: crops
      if: always() && steps.observe.outputs.bundle != ''
      continue-on-error: true
      shell: bash
      env:
        OBSERVED_BUNDLE: ${{ steps.observe.outputs.bundle }}
        OBSERVED_ARTIFACT: ${{ inputs.artifact-name }}
        OBSERVED_SCRIPT: ${{ steps.install.outputs.script }}
      run: |
        crops="$(mktemp -d "$RUNNER_TEMP/observed-crops-XXXXXX")/$OBSERVED_ARTIFACT-screenshots.png"
        bun "$OBSERVED_SCRIPT" crops "$OBSERVED_BUNDLE/result.json" "$crops"

    # One file, so GitHub opens the PNG in the browser instead of a zip.
    - name: Upload the screenshot crops
      id: upload-crops
      if: always() && steps.crops.outputs.path != ''
      continue-on-error: true
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        path: ${{ steps.crops.outputs.path }}
        archive: false
        retention-days: ${{ inputs.retention-days }}

    - name: Upload the evidence bundle
      if: always() && steps.observe.outputs.bundle != ''
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ steps.observe.outputs.bundle }}
        retention-days: ${{ inputs.retention-days }}

    # Minted after capture: the token never sits in the environment of the
    # capture step, which runs pull request code.
    - name: Create a GitHub App token
      id: app-token
      if: ${{ !cancelled() && steps.observe.outputs.bundle != '' && inputs.github-app-client-id != '' && inputs.github-app-private-key != '' }}
      continue-on-error: true
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        client-id: ${{ inputs.github-app-client-id }}
        private-key: ${{ inputs.github-app-private-key }}
        permission-pull-requests: write

    # A delivery problem is reported here and never changes the job's result.
    - name: Post the result to the pull request and Slack
      id: deliver
      if: ${{ !cancelled() && steps.observe.outputs.bundle != '' }}
      continue-on-error: true
      shell: bash
      env:
        OBSERVED_BUNDLE: ${{ steps.observe.outputs.bundle }}
        OBSERVED_EXIT: ${{ steps.observe.outputs.exit-code }}
        OBSERVED_ARTIFACT: ${{ inputs.artifact-name }}
        OBSERVED_PAGE_URL: ${{ steps.upload-page.outputs.artifact-url }}
        OBSERVED_GITHUB_TOKEN: ${{ inputs.github-token }}
        OBSERVED_CHECK_RUN_ID: ${{ job.check_run_id }}
        OBSERVED_APP_CLIENT_ID_SET: ${{ inputs.github-app-client-id != '' }}
        OBSERVED_APP_KEY_SET: ${{ inputs.github-app-private-key != '' }}
        OBSERVED_APP_TOKEN: ${{ steps.app-token.outputs.token }}
        OBSERVED_APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        OBSERVED_APP_TOKEN_OUTCOME: ${{ steps.app-token.outcome }}
        OBSERVED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        OBSERVED_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        OBSERVED_PULL_REQUEST: ${{ github.event.pull_request.number }}
        OBSERVED_SLACK_BOT_TOKEN: ${{ inputs.slack-bot-token }}
        OBSERVED_SLACK_CHANNEL: ${{ inputs.slack-channel }}
        OBSERVED_SLACK_IMAGES: ${{ inputs.slack-images }}
        OBSERVED_COMMENT: ${{ inputs.comment }}
        OBSERVED_CROPS_PATH: ${{ steps.crops.outputs.path }}
        OBSERVED_CROPS_URL: ${{ steps.upload-crops.outputs.artifact-url }}
        OBSERVED_IMAGE_TOKEN: ${{ inputs.image-upload-token }}
        OBSERVED_SCRIPT: ${{ steps.install.outputs.script }}
      run: bun "$OBSERVED_SCRIPT" deliver "$OBSERVED_BUNDLE/result.json" "$OBSERVED_EXIT" "$OBSERVED_ARTIFACT" "$OBSERVED_PAGE_URL"

    - name: Summarize the result
      id: summary
      if: always() && steps.observe.outcome != 'skipped'
      shell: bash
      env:
        OBSERVED_BUNDLE: ${{ steps.observe.outputs.bundle }}
        OBSERVED_EXIT: ${{ steps.observe.outputs.exit-code }}
        OBSERVED_ARTIFACT: ${{ inputs.artifact-name }}
        OBSERVED_PAGE_URL: ${{ steps.upload-page.outputs.artifact-url }}
        OBSERVED_DELIVERY_NOTE: ${{ steps.deliver.outputs.note }}
        OBSERVED_CROPS_PATH: ${{ steps.crops.outputs.path }}
        OBSERVED_CROPS_URL: ${{ steps.upload-crops.outputs.artifact-url }}
        OBSERVED_IMAGE: ${{ steps.deliver.outputs.image }}
        OBSERVED_IMAGE_NOTE: ${{ steps.deliver.outputs.image-note }}
        OBSERVED_SCRIPT: ${{ steps.install.outputs.script }}
      run: bun "$OBSERVED_SCRIPT" summary "$OBSERVED_BUNDLE/result.json" "$OBSERVED_EXIT" "$OBSERVED_ARTIFACT" "$OBSERVED_PAGE_URL"

    # The job's conclusion is the verdict: it reads only the capture's exit
    # code and whether its result was readable, never the delivery.
    - name: Fail unless Observed found no failure
      if: steps.observe.outputs.exit-code != '0' || steps.summary.outputs.trusted != 'true'
      shell: bash
      env:
        OBSERVED_EXIT: ${{ steps.observe.outputs.exit-code }}
      run: |
        echo "Observed exited with ${OBSERVED_EXIT:-no code}. See the job summary."
        if [ "${OBSERVED_EXIT:-0}" = 0 ]; then exit 1; fi
        exit "$OBSERVED_EXIT"
