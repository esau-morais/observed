<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Gate corpus</title>
  </head>
  <body>
    <main>
      <h1>Item list</h1>
      <p id="description">Load the saved items.</p>
      <button type="button">Load items</button>
      <p id="result" role="status">Waiting</p>
    </main>
    <script type="module">
      import { requestedCount } from '/counts.js';
      document.querySelector('button').addEventListener('click', async () => {
        await Promise.all(
          Array.from({ length: requestedCount() }, () => fetch('/api/items')),
        );
        document.querySelector('#result').textContent = 'Items loaded';
        document.body.dataset.done = 'true';
      });
    </script>
  </body>
</html>
