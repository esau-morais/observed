name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  pull_request:
    paths:
      - package.json
      - bun.lock
      - action.yml
      - src/**
      - scripts/**
      - viewer/**
      - vite.config.ts
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tag:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the tag, version and changelog agree
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(jq -r .version package.json)"
          test "$TAG" = "v$version" || { echo "::error::Tag $TAG does not match package.json version $version"; exit 1; }
          awk -v heading="## $version (" 'index($0, heading) == 1 {found=1} END {exit !found}' CHANGELOG.md || { echo "::error::CHANGELOG.md has no entry for $version"; exit 1; }
      - name: Check the tagged commit is on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status="$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$GITHUB_SHA" --jq .status)"
          case "$status" in
            identical | behind) ;;
            *) echo "::error::$GITHUB_SHA is not on main (compare status: $status)"; exit 1 ;;
          esac

  package:
    name: Package on ${{ matrix.os }}
    needs: tag
    if: ${{ !cancelled() && (needs.tag.result == 'success' || needs.tag.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Pack
        run: |
          mkdir -p "$RUNNER_TEMP/package"
          bun pm pack --destination "$RUNNER_TEMP/package" --quiet
      - name: Install the tarball outside the checkout and run the example
        run: |
          set -- "$RUNNER_TEMP"/package/*.tgz
          test -f "$1"
          bun scripts/verify-package.ts "$1" "$RUNNER_TEMP/verify" \
            --commit "$(git rev-parse HEAD)" \
            ${{ runner.os == 'Linux' && '--with-deps' || '' }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: package-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/package/
            ${{ runner.temp }}/verify/*.log
            ${{ runner.temp }}/verify/summary.json
          retention-days: 7

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [tag, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Publishes the tarball the Linux x64 package job installed and ran.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-ubuntu-24.04
          path: ${{ runner.temp }}/verified
      - name: Check the tarball was built from the tagged commit without changes
        run: |
          jq -e --arg sha "$GITHUB_SHA" '.observedSource == {kind: "git", commit: $sha, trackedChanges: false}' \
            "$RUNNER_TEMP/verified/verify/summary.json"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing (OIDC) needs npm 11.5.1 or later and attaches
      # provenance. NPM_TOKEN exists only to create the package the first time.
      # Skips a version npm already has, so a failed later step can be re-run.
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -- "$RUNNER_TEMP"/verified/package/*.tgz
          test -f "$1"
          version="$(jq -r .version package.json)"
          if npm view "$(jq -r .name package.json)@$version" version >/dev/null 2>&1; then
            echo "$version is already on npm"
            exit 0
          fi
          node -e 'const [a,b,c]=process.argv[1].split(".").map(Number);process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)' "$(npm --version)" \
            || { echo "::error::npm $(npm --version) is older than 11.5.1"; exit 1; }
          npm publish "$1" --access public --provenance
      - name: Create the GitHub release and move the major tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          awk -v heading="## $version (" 'index($0, heading) == 1 {on=1; next} /^## / && on {exit} on' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" "$RUNNER_TEMP"/verified/package/*.tgz \
              --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          fi
          major="${TAG%%.*}"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$major" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$major" -f sha="$GITHUB_SHA" -F force=true >/dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$major" -f sha="$GITHUB_SHA" >/dev/null
          fi
          echo "Released $TAG; $major now points at $GITHUB_SHA"
