name: Observe

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: observe-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  request-lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./
        with:
          project: examples/request-lab
          base: ${{ github.event.pull_request.base.sha }}
