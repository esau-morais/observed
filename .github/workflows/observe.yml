name: Observe

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: observe-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Exercises this pull request's action on an example app. Only
  # self-observe posts to the pull request, so this job keeps a read-only
  # token and reports in its own summary.
  request-lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./
        env:
          OBSERVED_FROM_SOURCE: true
        with:
          project: examples/request-lab
          base: ${{ github.event.pull_request.base.sha }}

  # Observed observes its own report viewer with the previous release, never
  # this checkout's action, so the pull request's code is only ever the
  # observed side. Bump the pin after each release.
  self-observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the base has the self-observe fixture
        id: base
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if git cat-file -e "$BASE:tests/fixtures/self-observe/captures.tar.gz" 2>/dev/null; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Observed::Not observed: the base has no self-observe fixture, so its viewer can't be captured."
            echo "**Not observed.** The base has no \`tests/fixtures/self-observe/captures.tar.gz\`, so its viewer can't be captured. Self-observation starts once the fixture is on the base branch." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: esau-morais/observed@ff217d89f43032a878100167856ae08aa44ae1e6 # v0.2.0-alpha.0
        if: steps.base.outputs.ready == 'true'
        with:
          project: .
          base: ${{ github.event.pull_request.base.sha }}
          timeout: '600000'
          artifact-name: observed-self
          github-app-client-id: ${{ vars.OBSERVED_APP_CLIENT_ID }}
          github-app-private-key: ${{ secrets.OBSERVED_APP_PRIVATE_KEY }}
